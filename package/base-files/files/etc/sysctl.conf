# User defined entries should be added to this file not to /etc/sysctl.d/* as
# that directory is not backed-up by default and will not survive a reimage
net.ipv4.neigh.default.gc_thresh1=1024
net.ipv4.neigh.default.gc_thresh2=2048
net.ipv4.neigh.default.gc_thresh3=4096
net.ipv6.neigh.default.gc_thresh1=1024
net.ipv6.neigh.default.gc_thresh2=2048
net.ipv6.neigh.default.gc_thresh3=4096

# Socket buffer limits for systems with many wireless interfaces (MLO/VAPs).
# hostapd's netlink receive buffer is capped by rmem_max, and restart bursts
# can otherwise lose key-management messages.
fs.file-max=524288

net.core.rmem_max=1048576
net.core.wmem_max=1048576
net.core.rmem_default=262144
net.core.wmem_default=262144

net.core.netdev_max_backlog=2000
